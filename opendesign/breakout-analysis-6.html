<style>

  body{font-family:var(--font-body);background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}

  .trading-badge{font-family:var(--font-display);font-size:.85rem;font-weight:500;color:var(--fg);background:oklch(96% 0.004 95);padding:5px 14px;border-radius:20px;display:flex;align-items:center;gap:8px}

  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn-ghost:hover{background:oklch(95% 0.005 95);color:var(--fg)}
  .main-wrap{max-width:1500px;margin:0 auto;padding:24px;width:100%;flex:1}

  .stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center}

  .stat-card .sl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  .stat-card .sv{font-family:var(--font-mono);font-size:1.4rem;font-weight:600;color:var(--fg)}
  .stat-card .ss{font-size:.65rem;color:var(--muted);margin-top:2px}

  .content-grid{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}

  /* Left */
  .filter-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .filter-panel .ph{padding:12px 14px;border-bottom:1px solid var(--border);font-family:var(--font-display);font-size:.8rem;font-weight:500}
  .filter-body{padding:10px 12px}
  .fg{margin-bottom:14px}
  .fgl{font-size:.64rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .fcs{display:flex;flex-wrap:wrap;gap:5px}
  .fc{padding:4px 12px;border-radius:16px;border:1px solid var(--border);font-size:.7rem;cursor:pointer;background:transparent;color:var(--muted);transition:all .12s}
  .fc:hover{border-color:var(--accent);color:var(--fg)}
  .fc.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .fc.on.promo{background:var(--up);border-color:var(--up)}
  .fc.on.fail{background:var(--down);border-color:var(--down)}
  .fc.on.new{background:oklch(55% 0.14 240);border-color:oklch(55% 0.14 240)}
  .lv-row{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:6px;font-size:.7rem;margin-bottom:1px;cursor:pointer;transition:background .1s}
  .lv-row:hover{background:oklch(97% 0.004 95)}
  .lv-row.active{background:oklch(94% 0.02 28 / 0.08)}
  .lv-rate{font-family:var(--font-mono);font-size:.66rem;font-weight:500}
  .lv-rate.good{color:var(--up)}.lv-rate.mid{color:var(--warn)}.lv-rate.low{color:var(--down)}

  /* Table */
  .table-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .table-panel .ph{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .table-panel .ph h3{font-family:var(--font-display);font-size:.85rem;font-weight:500}
  .tw{overflow:auto;max-height:62vh}
  table{width:100%;border-collapse:collapse;font-size:.77rem}
  th{text-align:left;padding:9px 10px;font-size:.66rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);background:oklch(97% 0.003 95);position:sticky;top:0;z-index:1;white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid oklch(96% 0.003 95);white-space:nowrap}
  tr{cursor:pointer;transition:background .1s}
  tr:hover td{background:oklch(97% 0.004 95)}
  tr.selected td{background:oklch(94% 0.02 28 / 0.08)}
  .nc{font-weight:500;color:var(--accent);text-decoration:underline;text-decoration-color:oklch(80% 0.04 28);text-underline-offset:3px;cursor:pointer}
  .nc:hover{color:oklch(46% 0.12 28)}
  .cc{font-size:.68rem;color:var(--muted);margin-left:3px}
  .st{font-size:.64rem;color:var(--muted);background:oklch(96% 0.003 95);padding:2px 7px;border-radius:4px}
  .pchain{display:inline-flex;align-items:center;gap:4px}
  .cs{font-family:var(--font-mono);font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:4px}
  .cs.y{background:oklch(92% 0.02 240 / 0.15);color:oklch(50% 0.10 240)}
  .cs.tu{background:oklch(90% 0.04 22 / 0.18);color:var(--up)}
  .cs.tn{background:oklch(90% 0.04 240 / 0.18);color:oklch(55% 0.14 240)}
  .cs.to{background:oklch(90% 0.04 155 / 0.18);color:var(--down)}
  .ca{color:var(--muted);font-size:.6rem}
  .rt{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.65rem;font-weight:600}
  .rt.promo{background:oklch(90% 0.04 22 / 0.18);color:var(--up)}
  .rt.fail{background:oklch(90% 0.04 155 / 0.2);color:var(--down)}
  .rt.new{background:oklch(90% 0.04 240 / 0.18);color:oklch(55% 0.14 240)}
  .val{font-family:var(--font-mono);font-weight:500;font-size:.73rem}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--surface);border-radius:16px;border:1px solid var(--border);width:820px;max-width:95vw;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.2);overflow:hidden}

  .mh .mhc{font-size:.7rem;color:var(--muted);font-family:var(--font-mono)}

  .mbody{flex:1;overflow-y:auto;padding:20px;min-height:280px}

  .analysis-block{background:oklch(97% 0.003 95);border-radius:10px;padding:14px 18px;margin-bottom:10px}

  .minfo{display:flex;flex-wrap:wrap;gap:8px;padding:8px 20px 14px;font-size:.68rem;color:var(--muted);border-top:1px solid var(--border);flex-shrink:0}
  .minfo span{background:oklch(96% 0.003 95);padding:3px 8px;border-radius:4px}

  @media(max-width:768px){
    .content-grid{grid-template-columns:1fr}.filter-panel{order:2}.table-panel{order:1}

    .modal{border-radius:12px}.mtab{padding:8px 12px;font-size:.7rem}.mbody{padding:12px}
    .overview-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:500px){.stats-row{grid-template-columns:repeat(2,1fr)}.main-wrap{padding:8px}}
</style>
</head>

function seededRand(seed){let s=seed;return function(){s=(s*16807+0)%2147483647;return(s-1)/2147483646;}}
function genIntraday(stock){
  const rand=seededRand(stock.code.split('').reduce((a,c)=>a+c.charCodeAt(0),0));
  const pts=[],AM_S=570,AM_E=690,PM_S=780,PM_E=900;
  const openPrice=stock.basePrice*(1+(rand()-.5)*.02);
  const limitPrice=openPrice*1.1;let price=openPrice;pts.push({t:AM_S,p:price});
  const isLimitUp=stock.tBoard>0;
  const failed=stock.result==='failed';
  const earlySeal=isLimitUp&&(stock.tTime||'99:99')<='09:45';
  const midSeal=isLimitUp&&(stock.tTime||'99:99')>'09:45'&&(stock.tTime||'99:99')<='10:30';
  const lateSeal=isLimitUp&&(stock.tTime||'99:99')>'10:30';
  let sealMin=earlySeal?AM_S+8+Math.floor(rand()*15):midSeal?AM_S+30+Math.floor(rand()*30):lateSeal?AM_S+60+Math.floor(rand()*60):-1;
  for(let m=AM_S+1;m<=AM_E;m++){
    if(earlySeal&&m>=sealMin){price=limitPrice*(.995+rand()*.005);if(rand()<.03&&stock.breaks>0)price=limitPrice*.97}
    else if(midSeal&&m>=sealMin){price=limitPrice*(.994+rand()*.006)}
    else if(lateSeal&&m>=sealMin){price=limitPrice*(.993+rand()*.007)}
    else if(failed){const drift=(rand()-.6)*.015;price=openPrice*(1+drift*(m-AM_S)/120);price=Math.min(price,openPrice*1.05)}
    else{const drift=(rand()-.45)*.01;price=Math.max(openPrice*.95,Math.min(openPrice*1.06,price+drift*price))}
    pts.push({t:m,p:price});
  }
  let middayPrice=pts[pts.length-1].p;
  for(let m=PM_S;m<=PM_E;m++){
    if(isLimitUp&&sealMin>0&&m>=PM_S){price=limitPrice*(.994+rand()*.006);if(rand()<.02)price=limitPrice*.975}
    else if(failed){const drift=(rand()-.55)*.02;price=middayPrice*(1+drift*(m-PM_S)/120);price=Math.min(price,middayPrice*1.03)}
    else{price=middayPrice*(1+(rand()-.5)*.008)};pts.push({t:m,p:price});
  }return pts;
}
function genDailyKline(stock){
  const rand=seededRand(stock.code.split('').reverse().reduce((a,c)=>a+c.charCodeAt(0),0));
  const days=60,klines=[];let price=stock.basePrice*(.7+rand()*.3);
  const trend=stock.result==='promoted'?.002:stock.result==='failed'?-.001:.001;
  for(let i=0;i<days;i++){const vol=.02+.04*rand();const drift=(rand()-.48+trend)*vol;const open=price;price=price*(1+drift);klines.push({o:open,h:Math.max(open,price)*(1+rand()*.015),l:Math.min(open,price)*(1-rand()*.015),c:price})}return klines;
}
function genWeeklyKline(daily){const w=[];for(let i=0;i<daily.length;i+=5){const s=daily.slice(i,i+5);if(s.length)w.push({o:s[0].o,h:Math.max(...s.map(k=>k.h)),l:Math.min(...s.map(k=>k.l)),c:s[s.length-1].c})}return w}
function genMonthlyKline(daily){const m=[];for(let i=0;i<daily.length;i+=21){const s=daily.slice(i,i+21);if(s.length)m.push({o:s[0].o,h:Math.max(...s.map(k=>k.h)),l:Math.min(...s.map(k=>k.l)),c:s[s.length-1].c})}return m}
function getKlineData(stock){if(klineCache[stock.code])return klineCache[stock.code];const d=genDailyKline(stock);const data={intraday:genIntraday(stock),daily:d,weekly:genWeeklyKline(d),monthly:genMonthlyKline(d)};klineCache[stock.code]=data;return data}

function drawCandleSvg(klines,W,H,pad){

  return `<svg viewBox="0 0 ${W} ${H}">${yGl}${ll}${rects}<path d="${ma5}" fill="none" stroke="oklch(55% 0.16 55)" stroke-width="1" stroke-dasharray="2,2" opacity=".7"/><path d="${ma10}" fill="none" stroke="oklch(55% 0.14 240)" stroke-width="1" stroke-dasharray="4,2" opacity=".7"/><path d="${ma20}" fill="none" stroke="oklch(40% 0.02 280)" stroke-width="1.2" opacity=".7"/>${lg}</svg>`;

  const up=stock.tBoard>0;
  return`<div class="overview-grid">
    <div class="ov-card"><div class="ovl">总市值</div><div class="ovv">${fmtMktCap(stock.marketCap)}</div></div>
    <div class="ov-card"><div class="ovl">流通市值</div><div class="ovv">${fmtMktCap(stock.floatCap)}</div></div>
    <div class="ov-card"><div class="ovl">量比</div><div class="ovv ${stock.volRatio>3?'up':''}">${stock.volRatio.toFixed(1)}</div></div>
    <div class="ov-card"><div class="ovl">成交额</div><div class="ovv">${stock.amount.toFixed(1)}亿</div></div>
    <div class="ov-card"><div class="ovl">成交量</div><div class="ovv">${fmtVol(stock.volume)}</div></div>
    <div class="ov-card"><div class="ovl">今日涨幅</div><div class="ovv ${up?'up':'down'}">${up?'+':''}${chgPct}%</div></div>
    <div class="ov-card"><div class="ovl">换手率</div><div class="ovv">${stock.turnover.toFixed(1)}%</div></div>
    <div class="ov-card"><div class="ovl">封单金额</div><div class="ovv">${stock.tBoard>0?stock.seal.toFixed(1)+'亿':'—'}</div></div>
  </div>
  <div class="analysis-block">
    <h4>📂 所属板块：${SECTORS[stock.sector]||stock.sector}</h4>
    <p>${stock.sectorReason}</p>
  </div>
  <div class="analysis-block">
    <h4>📈 今日涨停原因分析</h4>
    <p>${stock.limitReason}</p>
  </div>`;
}

function renderModalContent(){
  const body=document.getElementById('mBody'),info=document.getElementById('mInfo');
  if(!selectedCode){body.innerHTML='';info.innerHTML='';return}
  const stock=stocks.find(s=>s.code===selectedCode);if(!stock)return;
  if(mTab==='overview'){
    body.innerHTML=renderOverview(stock);
  }else{
    const data=getKlineData(stock);const W=720,H=300;let svg='';
    if(mTab==='intraday'){const op=data.intraday[0].p;const lp=stock.tBoard>0?op*1.1:null;svg=drawIntradaySvg(data.intraday,W,H,lp)}
    else if(mTab==='daily')svg=drawCandleSvg(data.daily.slice(-50),W,H);
    else if(mTab==='weekly')svg=drawCandleSvg(data.weekly.slice(-35),W,H);
    else svg=drawCandleSvg(data.monthly,W,H);
    body.innerHTML=svg;
  }
  const data=getKlineData(stock),lastD=data.daily[data.daily.length-1],prevD=data.daily[data.daily.length-2];
  info.innerHTML=`<span>昨收: ¥${prevD?.c.toFixed(2)||'—'}</span><span>60日涨跌: ${((lastD.c-data.daily[0].c)/data.daily[0].c*100).toFixed(1)}%</span><span>市值: ${fmtMktCap(stock.marketCap)}</span><span>量比: ${stock.volRatio.toFixed(1)}</span>`;
}
function switchMTab(tab){mTab=tab;document.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));renderModalContent()}
function openModal(code){selectedCode=code;const s=stocks.find(st=>st.code===code);document.getElementById('mTitle').textContent=s?.name||'—';document.getElementById('mCode').textContent=s?.code||'';mTab='overview';document.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='overview'));document.getElementById('modalOverlay').classList.remove('hidden');renderTable();renderModalContent()}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden');selectedCode=null;renderTable()}
function setFilter(f,el){filter=f;if(f!=='all')activeLv=null;document.querySelectorAll('#rfChips .fc').forEach(c=>c.classList.remove('on'));if(el)el.classList.add('on');renderAll()}
function toggleLevelFilter(lv){if(activeLv===lv){activeLv=null}else{activeLv=lv;filter='all';document.querySelectorAll('#rfChips .fc').forEach(c=>c.classList.remove('on'));document.querySelector('#rfChips [data-filter="all"]')?.classList.add('on')}renderAll()}
function getFiltered(){let list=filter==='all'?[...stocks]:stocks.filter(s=>s.result===filter);if(activeLv){const lv=parseInt(activeLv);list=list.filter(s=>s.yBoard===lv||(lv===4&&s.yBoard>=4)||(s.result==='new'&&lv===0))}return list}
function getLevelStat(yB){const g=stocks.filter(s=>s.yBoard===yB||(yB===4&&s.yBoard>=4));const p=g.filter(s=>s.result==='promoted').length;const t=g.length;return{total:t,promoted:p,failed:t-p,rate:t>0?(p/t*100).toFixed(1):'—'}}
function getCounts(){let pr=0,fa=0,nw=0;stocks.forEach(s=>{if(s.result==='promoted')pr++;else if(s.result==='failed')fa++;else nw++});const ty=pr+fa;return{pr,fa,nw,ty,or:ty>0?(pr/ty*100).toFixed(1):'—'}}
function renderStats(){
  const c=getCounts(),l1=getLevelStat(1),l2=getLevelStat(2),l3=getLevelStat(3);
  document.getElementById('statsRow').innerHTML=[{l:'今日涨停',v:c.pr+c.nw,s:`晋级${c.pr}+新进${c.nw}`,hl:1},{l:'1→2 晋级率',v:l1.rate+'%',s:`${l1.promoted}/${l1.total}`,cl:+l1.rate>=50?'var(--up)':'var(--warn)'},{l:'2→3 晋级率',v:l2.rate+'%',s:`${l2.promoted}/${l2.total}`,cl:+l2.rate>=50?'var(--up)':'var(--warn)'},{l:'3→4+ 晋级率',v:l3.rate+'%',s:`${l3.promoted}/${l3.total}`,cl:+l3.rate>=50?'var(--up)':'var(--warn)'},{l:'整体晋级率',v:c.or+'%',s:`${c.pr}/${c.ty}`,cl:+c.or>=40?'var(--up)':'var(--down)'},{l:'断板/新进',v:`🔻${c.fa} 🔷${c.nw}`,s:`断板率${c.ty>0?(c.fa/c.ty*100).toFixed(1):'—'}%`}].map(c=>`<div class="stat-card${c.hl?' hl':''}"><div class="sl">${c.l}</div><div class="sv"${c.cl?` style="color:${c.cl}"`:''}>${c.v}</div><div class="ss">${c.s}</div></div>`).join('')}
function renderLevelStats(){document.getElementById('levelStats').innerHTML=[1,2,3,4].map(b=>{const st=getLevelStat(b);const lb=b===1?'首板':b===2?'二板':b===3?'三板':'四板+';const rc=+st.rate>=50?'good':+st.rate>=30?'mid':'low';return`<div class="lv-row${activeLv===String(b)?' active':''}" onclick="toggleLevelFilter('${b}')"><span>${lb} →</span><span class="lv-rate ${rc}">${st.rate}%</span></div>`}).join('')}
function renderTable(){
  const list=getFiltered();document.getElementById('tableCount').textContent=`${list.length} 只`;
  const tb=document.getElementById('tableBody');
  tb.innerHTML=list.map(s=>{
    let ch='';if(s.result==='promoted'){const yl=s.yBoard===1?'首':s.yBoard===2?'二':s.yBoard===3?'三':`${s.yBoard}`;const tl=s.tBoard===2?'二':s.tBoard===3?'三':s.tBoard>=4?`${s.tBoard}`:`${s.tBoard}`;ch=`<span class="pchain"><span class="cs y">${yl}板</span><span class="ca">→</span><span class="cs tu">${tl}板</span></span>`}else if(s.result==='failed'){const yl=s.yBoard===1?'首':s.yBoard===2?'二':s.yBoard===3?'三':`${s.yBoard}`;ch=`<span class="pchain"><span class="cs y">${yl}板</span><span class="ca">→</span><span class="cs to">断</span></span>`}else{ch=`<span class="pchain"><span style="font-size:.65rem;color:var(--muted)">—</span><span class="ca">→</span><span class="cs tn">首板</span></span>`}
    let rh='';if(s.result==='promoted')rh='<span class="rt promo">晋级</span>';else if(s.result==='failed')rh='<span class="rt fail">断板</span>';else rh='<span class="rt new">新进</span>';
    const sh=s.tBoard>0?`<span class="val up">${s.seal.toFixed(1)}亿</span>`:'<span style="color:var(--muted)">—</span>';
    return`<tr class="${selectedCode===s.code?'selected':''}"><td><span class="nc" onclick="event.stopPropagation();openModal('${s.code}')">${s.name}</span><span class="cc">${s.code}</span></td><td><span class="st">${SECTORS[s.sector]||s.sector}</span></td><td>${ch}</td><td>${rh}</td><td style="font-family:var(--font-mono);font-size:.73rem">${s.tTime}</td><td>${sh}</td></tr>`
  }).join('')||'<tr><td colspan="6" style="text-align:center;padding:36px;color:var(--muted)">无匹配数据</td></tr>';
}
function renderAll(){renderStats();renderLevelStats();renderTable();if(selectedCode)renderModalContent()}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderAll();
</script>
</body>
</html>
