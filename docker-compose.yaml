services:
  gateway:
    image: ghcr.io/oouxx/openatrading:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - RUST_BACKTRACE=1
      - TZ=Asia/Shanghai
      - MCP_ENDPOINT=http://akshare-mcp:8081
    volumes:
      - ~/.atrading:/root/.atrading
      - ./downloads:/app/downloads
    restart: unless-stopped

  frontend:
    image: ghcr.io/oouxx/openatrading-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/certs:/etc/ssl/cloudflare:ro
    restart: unless-stopped

  akshare-mcp:
    build:
      context: .
      dockerfile: docker/akshare-mcp/Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
