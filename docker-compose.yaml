services:
  backend:
    image: trending-agent-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - RUST_BACKTRACE=1
    restart: unless-stopped

  frontend:
    image: trending-agent-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "18080:80"
    environment:
      - BACKEND_HOST=backend
    depends_on:
      - backend
    restart: unless-stopped
