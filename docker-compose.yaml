services:
  backend:
    image: trending-agent-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      - RUST_BACKTRACE=1
    restart: unless-stopped

  frontend:
    image: trending-agent-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/certs:/etc/ssl/cloudflare:ro
    environment:
      - BACKEND_HOST=backend
    depends_on:
      - backend
    restart: unless-stopped
