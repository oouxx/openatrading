services:
  gateway:
    image: ghcr.io/oouxx/openatrading:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - RUST_BACKTRACE=1
      - TZ=Asia/Shanghai
      # pi-rs agent dir must point at the mounted volume so settings.json /
      # auth.json / sessions / skills persist on the host. Overrides any
      # PI_RS_HOME brought in via env_file (.env) which is relative for local dev.
      - PI_RS_HOME=/root/.atrading
    volumes:
      - ~/.atrading:/root/.atrading
    restart: unless-stopped

  frontend:
    image: ghcr.io/oouxx/openatrading-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/certs:/etc/ssl/cloudflare:ro
      - ./install.sh:/app/install.sh
    restart: unless-stopped

  akshare-mcp:
    # CI 部署时只 pull 不 build，所以必须有 image:（本地开发仍走 build:）
    image: ghcr.io/oouxx/openatrading-akshare-mcp:latest
    build:
      context: .
      dockerfile: docker/akshare-mcp/Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
