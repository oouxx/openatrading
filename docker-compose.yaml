services:
  openatrading:
    image: ghcr.io/oouxx/openatrading:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - RUST_BACKTRACE=1
      - TZ=Asia/Shanghai
    volumes:
      - ~/.atrading:/root/.atrading
      - .:/app
    restart: unless-stopped
