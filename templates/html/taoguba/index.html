<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淘股吧用户列表</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        h1 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .user-list { list-style: none; padding: 0; }
        .user-item { margin: 12px 0; padding: 15px; background: #f9f9f9; border-radius: 6px; border-left: 4px solid #007bff; }
        .user-item a { color: #007bff; text-decoration: none; font-size: 18px; font-weight: 600; }
        .user-item a:hover { text-decoration: underline; }
        .meta { color: #666; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>📊 淘股吧用户列表</h1>
    <ul class="user-list">
        {% for user in users %}
        <li class="user-item">
            <a href="user-{{ user.user_id }}.html">{{ user.nickname }}</a>
            <div class="meta">用户ID: {{ user.user_id }} | 帖子数: {{ user.post_count }} | 最后更新: {{ user.last_update }}</div>
            <div class="meta">置顶帖: {{ user.top_post_title }}</div>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
