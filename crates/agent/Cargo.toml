[package]
name = "openatrading-agent"
version = "0.10.3"
edition = "2021"

[lib]
name = "openatrading_agent"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
md5 = { workspace = true }
sha1 = { workspace = true }
futures = { workspace = true }
thiserror = "2"
pi-agent-core = {git = "https://github.com/oouxx/pi-rs", tag = "v1.78.0" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }