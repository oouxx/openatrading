[package]
name = "openatrading-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openatrading_agent"
path = "src/lib.rs"

[dependencies]
pi-coding-agent = { git = "https://github.com/oouxx/pi-rs", tag = "v1.79.11" }
pi-agent-core = { git = "https://github.com/oouxx/pi-rs", tag = "v1.79.11", features = ["extraction", "mcp"] }
pi-ai = { git = "https://github.com/oouxx/pi-rs", tag = "v1.79.11" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
thiserror = "2"
schemars = { version = "0.8", features = ["derive"] }
tracing = "0.1"
axum = "0.7"
rmcp = { version = "1.7", features = [
    "client",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-io",
    "transport-child-process",
] }

[features]
default = []
