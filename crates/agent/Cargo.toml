[package]
name = "openatrading-agent"
version = "0.11.0"
edition = "2021"

[lib]
name = "openatrading_agent"
path = "src/lib.rs"

[dependencies]
openatrading-provider = { path = "../provider" }
tokio = { workspace = true, features = ["sync", "macros", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
async-stream = "0.3"
pi-agent-core = {git = "https://github.com/oouxx/pi-rs", tag = "v1.78.7", features = ["extraction"] }
pi-ai = {git = "https://github.com/oouxx/pi-rs", tag = "v1.78.7" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
