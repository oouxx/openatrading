<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股市场 AI 分析报告</title>
<style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .container { background: #fff; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        h2 { color: #555; margin-top: 30px; border-left: 4px solid #007bff; padding-left: 10px; }
        h3 { color: #666; }
        h4 { color: #777; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        /* Sticky headers for tables */
        th { background: #007bff; color: #fff; position: sticky; top: 0; z-index: 2; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background-color: #f1f5f9; }
        .info { color: #666; font-size: 14px; margin-bottom: 20px; }
        .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; color: #999; font-size: 14px; }
        ul, ol { margin: 10px 0; padding-left: 25px; }
        li { margin: 5px 0; }
        blockquote { border-left: 4px solid #ddd; margin: 15px 0; padding: 10px 15px; color: #666; background: #f9f9f9; }
        /* Card layout primitives */
        .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); margin-bottom: 12px; }
        /* Grid system for dense info */ 
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        /* Signal and risk tags */ 
        .signal { display: inline-block; padding: 2px 6px; border-radius: 4px; color: #fff; font-weight: 600; font-size: 12px; }
        .signal-bull { background: #28a745; }
        .signal-bear { background: #dc3545; }
        .risk-high { background: #f8d7da; color: #721c24; padding: 2px 6px; border-radius: 4px; }
        .risk-mid { background: #fff3cd; color: #856404; padding: 2px 6px; border-radius: 4px; }
        .risk-low { background: #d4edda; color: #155724; padding: 2px 6px; border-radius: 4px; }
        /* Subpage links container */ 
        .subpage-links { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 6px; }
        .subpage-links a { display: inline-block; margin: 5px 10px 5px 0; padding: 8px 16px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .subpage-links a:hover { background: #0056b3; }
        /* End of new styles */ 
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 A股市场 AI 分析报告</h1>
        <p class="info">生成时间：{{ date }}</p>
        <div class="subpage-links">
            <a href="community/index.html">📰 社群文章</a>
            <a href="taoguba/index.html">📊 淘股吧</a>
            <a href="xuangubao/limit-up.html">📈 选股宝涨停</a>
            <a href="xuangubao/plates.html">📊 板块异动</a>
        </div>

        {{ overview | safe }}

        {{ board_distribution | safe }}

        {{ limit_up_table | safe }}

        {{ plate_abnormal | safe }}

        {{ field_items | safe }}

        {{ timeline | safe }}

        {{ sentiment | safe }}

        {{ analyses | safe }}

        <div class="footer">
            <p>⚠️ AI 生成内容，仅供参考，不构成投资建议</p>
        </div>
    </div>
</body>
</html>
