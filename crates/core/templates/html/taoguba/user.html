<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户 {{ nickname }} 的帖子</title>
    <style>
        body { font-family: sans-serif; max-width: 1000px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
        .container { background: #fff; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .post { margin: 20px 0; padding: 20px; background: #f9f9f9; border-radius: 6px; border-left: 4px solid #28a745; }
        .post-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .post-meta { color: #666; font-size: 14px; margin-bottom: 15px; }
        .post-content { line-height: 1.6; color: #555; }
        .back-link { display: inline-block; margin-top: 20px; padding: 8px 16px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>用户 {{ nickname }} ({{ user_id }}) 的帖子</h1>
        <p>共 {{ post_count }} 篇帖子</p>
        {% for post in posts %}
        <div class="post">
            <div class="post-title">{{ loop.index }}. {{ post.title }}</div>
            <div class="post-meta">时间: {{ post.create_time }} | 浏览: {{ post.view_count }} | 回复: {{ post.reply_count }}</div>
            <div class="post-content">{{ post.content | safe }}</div>
            <p><a href="{{ post.link }}">原文链接</a></p>
        </div>
        {% endfor %}
        <a href="index.html" class="back-link">← 返回列表</a>
    </div>
</body>
</html>
