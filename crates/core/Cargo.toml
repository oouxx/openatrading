[package]
name = "openatrading-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openatrading_core"
path = "src/lib.rs"

[dependencies]
openatrading-channels = { path = "../channels" }
openatrading-api = { path = "../api" }
openatrading-agent = { path = "../agent" }
openatrading-extension = { path = "../extension" }
pi-coding-agent = { workspace= true }
pi-extension-api = { workspace = true }
arc-swap = "1"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-cron-scheduler = "0.13"
chrono-tz = "0.10"
async-trait = "0.1"
schemars = { version = "0.8", features = ["derive"] }
gray_matter = "0.3"
axum = "0.7"
serde_yaml = "0.9"
teloxide = { version = "0.15", optional = true }
tauri = { version = "2", optional = true }
thiserror = "2"
tracing = "0.1"

[features]
telegram = ["dep:teloxide"]
tauri = ["dep:tauri"]
web = []

[dev-dependencies]
toml = "0.8"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync"] }


[lints]
workspace = true