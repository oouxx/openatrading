[package]
name = "openatrading-core"
version = "0.12.8"
edition = "2021"

[lib]
name = "openatrading_core"
path = "src/lib.rs"

[dependencies]
openatrading-channels = { path = "../channels" }
openatrading-api = { path = "../api" }
openatrading-agent = { path = "../agent" }
pi-coding-agent = { git = "https://github.com/oouxx/pi-rs", tag = "v1.79.8" }
pi-extension-api = { git = "https://github.com/oouxx/pi-rs", tag = "v1.79.8" }
arc-swap = "1"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-cron-scheduler = "0.13"
chrono-tz = "0.10"
async-trait = "0.1"
schemars = { version = "0.8", features = ["derive"] }
gray_matter = "0.3"
axum = "0.7"
serde_yaml = "0.9"
teloxide = { version = "0.15", optional = true }
thiserror = "2"
tracing = "0.1"

[features]
telegram = ["dep:teloxide"]

[dev-dependencies]
toml = "0.8"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync"] }