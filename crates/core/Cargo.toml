[package]
name = "openatrading-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openatrading_core"
path = "src/lib.rs"

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
openatrading-channels = { path = "../channels" }
openatrading-api = { path = "../api" }
openatrading-agent = { path = "../agent" }
openatrading-extension = { path = "../extension" }
pi-coding-agent = { workspace= true }
pi-ai = { workspace = true }
pi-extension-api = { workspace = true }
arc-swap = "1"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-cron-scheduler = "0.13"
chrono-tz = "0.10"
async-trait = "0.1"
schemars = { version = "0.8", features = ["derive"] }
gray_matter = "0.3"
teloxide = { version = "0.15", optional = true }
tauri = { version = "2", optional = true }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["channel-telegram", "channel-discord", "channel-slack", "channel-lark"]
telegram = ["dep:teloxide"]
tauri = ["dep:tauri"]
web = []
channel-telegram = ["openatrading-channels/channel-telegram"]
channel-discord = ["openatrading-channels/channel-discord"]
channel-slack = ["openatrading-channels/channel-slack"]
channel-lark = ["openatrading-channels/channel-lark"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync"] }
tempfile = "3"

[lints]
workspace = true
