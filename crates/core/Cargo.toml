[package]
name = "openatrading-core"
version = "0.12.6"
edition = "2021"

[lib]
name = "openatrading_core"
path = "src/lib.rs"

[dependencies]
openatrading-channels = { path = "../channels" }
openatrading-api = { path = "../api" }
openatrading-provider = { path = "../provider" }
openatrading-agent = { path = "../agent", features = ["mcp"] }
arc-swap = "1"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-cron-scheduler = "0.13"
chrono-tz = "0.10"
async-trait = "0.1"
schemars = { version = "0.8", features = ["derive"] }
gray_matter = "0.3"
axum = "0.7"
serde_yaml = "0.9"
rmcp = { version = "1.7", features = [
    "client",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-io",
    "transport-child-process",
] }
teloxide = { version = "0.15", optional = true }
thiserror = "2"
tracing = "0.1"

[features]
telegram = ["dep:teloxide"]

[dev-dependencies]
toml = "0.8"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync"] }