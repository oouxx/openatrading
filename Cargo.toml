[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/cli",
    "crates/channels",
    "crates/provider",
    "crates/web",
    "src-tauri",
    "crates/agent",
    "crates/tui",
]

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros", "time", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip", "charset"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dotenvy = "0.15"
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
