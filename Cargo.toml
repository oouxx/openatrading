[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/cli",
    "crates/channels",
    "crates/web",
    "src-tauri",
    "crates/agent",
    "crates/extension",
]

[workspace.package]
version = "0.13.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros", "time", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip", "charset"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dotenvy = "0.15"
async-trait = "0.1"
pi-extension-api = { git = "https://github.com/oouxx/pi-rs", tag = "v1.80.0" }
pi-extensions = { git = "https://github.com/oouxx/pi-rs", tag = "v1.80.0" }
pi-coding-agent = { git = "https://github.com/oouxx/pi-rs", tag = "v1.80.0" }
ahash = { version = "0.8", features = ["serde"] }
lru = "0.12"

[workspace.lints.clippy]
all = "warn"
# pedantic = "warn"
# nursery = "warn"
unwrap_used = "warn"       # 生产代码禁止裸 unwrap
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
codegen-units = 8
