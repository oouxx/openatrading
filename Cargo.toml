[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/web",
    "crates/wasm",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "rustls-tls"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
futures = "0.3"
dotenvy = "0.15"
askama = "0.15"
regex = "1"

[profile.release]
opt-level = 3
