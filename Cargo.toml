[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/web",
    "crates/wasm",
    "src-tauri",
]

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros", "time", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "rustls-tls", "http2", "charset"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dotenvy = "0.15"
askama = "0.15"
regex = "1"
sha1 = "0.10"
md5 = "0.7"
url = "2"
[profile.release]
opt-level = 3