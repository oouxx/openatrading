[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/cli",
    "crates/channels",
    "crates/web",
    "src-tauri",
    "crates/agent",
    "crates/extension",
]

[workspace.package]
version = "0.12.9"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros", "time", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip", "charset"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dotenvy = "0.15"
async-trait = "0.1"
pi-extension-api = { git = "https://github.com/oouxx/pi-rs", tag = "v1.79.15" }
pi-extensions = { git = "https://github.com/oouxx/pi-rs", tag = "v1.79.15" }
pi-coding-agent = { git = "https://github.com/oouxx/pi-rs", tag = "v1.79.15" }
[profile.dev]
incremental = true
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
codegen-units = 8    # Parallel codegen for faster builds on powerful machines (16GB+ RAM recommended)
                     # Use: cargo build --profile release-fast
