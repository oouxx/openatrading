# ── OpenATrading 配置 ──────────────────────────────────
# 优先级：项目根 config.toml > 项目根/.atrading/config.toml > ~/.atrading/config.toml
# 角色（role）= 交易账号标签（name + display_name），用于按策略分区持仓/交易日志。
# 在 角色管理 UI 或 ~/.atrading/roles/{name}.toml 中创建可编辑角色；
# 在此处用 [[roles]] 声明的角色为只读（readonly），无法通过 UI 删除。示例：
# [[roles]]
# name = "zarili"
# display_name = "扎哩哩"
# readonly = true
# 复制为 config.toml 后修改

# ── MCP 服务器 ────────────────────────────────────────────
# akshare 数据源（Docker 环境下使用服务名，本地改为 localhost）
[[mcp_servers]]
name = "akshare"
transport = { type = "streamable-http", url = "http://akshare-mcp:8081/mcp" }
enabled = true

# ── MCP Server ─────────────────────────────────────────────
# 本服务暴露的 MCP 行情工具 server（注意与 [[mcp_servers]] 复数配置的区别）
[mcp_server]
enabled = true
bind    = "0.0.0.0:8082"

# ── 后台服务 ─────────────────────────────────────────────
[service]
db_path = "data.db"
web_bind = "0.0.0.0:8080"

# ── Cron 调度 ────────────────────────────────────────────
# cron 表达式为 6 字段：秒 分 时 日 月 周
[cron]
enabled = true
collection_schedule = "0 0 18 * * 1-5"
news_schedule = "0 */5 9-15 * * 1-5"

# ── LLM 配置 ────────────────────────────────────────────────
[llm]
provider = "openrouter"
model = "openrouter/free"

# ── 社交平台通知 ──────────────────────────────────────────
[social]
notify_channel = "telegram"
notify_on_collect = true
notify_on_decision = true
notify_on_trade = true
notify_on_news = true

[social.telegram]
enabled = true
bot_polling = true
bot_token = "${TELEGRAM_BOT_TOKEN}"
chat_id = "${TELEGRAM_CHAT_ID}"

