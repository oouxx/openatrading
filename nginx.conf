# WebSocket upgrade mapping: $connection_upgrade is "upgrade" for WS handshakes,
# empty otherwise (preserves upstream keep-alive for normal HTTP/SSE).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name trading.96112901.xyz;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name trading.96112901.xyz;

    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 256;

    root /app/dist;
    index index.html;

    # API proxy -> gateway container (docker-compose service name).
    # Covers regular REST, SSE (/api/realtime/stream, /api/kline/stream) and
    # WebSocket (/api/ai/sessions/ws). All are long-lived / streaming, so:
    # - HTTP/1.1 + Upgrade/Connection headers enable the WS handshake
    # - proxy_buffering off so SSE/WS events flush immediately
    # - long read/send timeouts so idle WS/SSE links aren't dropped at 60s
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /downloads/ {
        alias /app/downloads/;
        autoindex off;
    }
    location = /install.sh {
        root /app;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
