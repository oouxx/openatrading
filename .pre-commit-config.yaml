repos:
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt (run twice + stage)
        entry: bash -c 'cargo fmt --all && cargo fmt --all && git add -u'
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: cargo clippy --fix
        entry: bash -c 'cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings && git add -u'
        language: system
        types: [rust]
        pass_filenames: false

      # - id: test
      #   name: cargo test
      #   entry: cargo test
      #   language: system
      #   types: [rust]
      #   pass_filenames: false
