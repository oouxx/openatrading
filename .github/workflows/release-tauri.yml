name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      macos:
        description: 'Build macOS'
        type: boolean
        default: false
      linux:
        description: 'Build Linux'
        type: boolean
        default: true
      windows:
        description: 'Build Windows'
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPLOAD_SERVER_HOST: ${{ secrets.UPLOAD_SERVER_HOST }}
  UPLOAD_SERVER_USER: ${{ secrets.UPLOAD_SERVER_USER }}
  UPLOAD_SERVER_PATH: ${{ secrets.UPLOAD_SERVER_PATH }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

  build-tauri-macos:
    needs: create-release
    if: (vars.MACOS_BUILD == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.macos == 'true'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_SIGNING: "true"
        run: cargo tauri build
      - name: Upload DMG to private repo
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
      - name: Upload DMG to public tap repo & update Cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          TAG="${{ github.ref_name }}"

          # Create release in public tap repo (idempotent, reuse if exists)
          gh release create "$TAG" \
            --repo oouxx/homebrew-openatrading \
            --title "$TAG" \
            --notes "OpenATrading $VERSION" \
            2>/dev/null || echo "Release $TAG already exists" >&2

          # Upload DMG to public tap repo
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --repo oouxx/homebrew-openatrading --clobber
          done

          # Update Cask formula's version
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/oouxx/homebrew-openatrading.git /tmp/homebrew-openatrading
          cd /tmp/homebrew-openatrading

          OLD_VER=$(grep 'version "' Casks/openatrading.rb | sed 's/.*"\(.*\)".*/\1/')
          if [ "$OLD_VER" = "$VERSION" ]; then
            echo "Cask already at $VERSION, skipping"
            exit 0
          fi

          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/openatrading.rb
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -m "openatrading $VERSION"
          git push
          git push

  build-tauri-linux-amd64:
    needs: create-release
    if: (vars.LINUX_BUILD != 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.linux == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .deb & .AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-tauri-linux-arm64:
    needs: create-release
    if: (vars.LINUX_BUILD != 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.linux == 'true'))
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .deb & .AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-tauri-windows:
    needs: create-release
    if: (vars.WINDOWS_BUILD == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.windows == 'true'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .msi & .exe
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
