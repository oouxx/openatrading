name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  UPLOAD_SERVER_HOST: ${{ secrets.UPLOAD_SERVER_HOST }}
  UPLOAD_SERVER_USER: ${{ secrets.UPLOAD_SERVER_USER }}
  UPLOAD_SERVER_PATH: ${{ secrets.UPLOAD_SERVER_PATH }}

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.ref_name }}"
            if echo "$TAG" | grep -qP '^v\d+\.\d+\.0$'; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-tauri-macos:
    needs: filter
    if: needs.filter.outputs.proceed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_SIGNING: "true"
        run: cargo tauri build
      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
      - name: Setup SSH agent for server upload
        if: env.UPLOAD_SERVER_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UPLOAD_SERVER_SSH_KEY }}
      - name: Upload to server
        if: env.UPLOAD_SERVER_HOST != ''
        uses: ./.github/actions/upload-to-server
        with:
          pattern: src-tauri/target/release/bundle/dmg/*.dmg

  build-tauri-linux-amd64:
    needs: filter
    if: needs.filter.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .deb & .AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Setup SSH agent for server upload
        if: env.UPLOAD_SERVER_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UPLOAD_SERVER_SSH_KEY }}
      - name: Upload .deb to server
        if: env.UPLOAD_SERVER_HOST != ''
        uses: ./.github/actions/upload-to-server
        with:
          pattern: src-tauri/target/release/bundle/deb/*.deb
      - name: Upload .AppImage to server
        if: env.UPLOAD_SERVER_HOST != ''
        uses: ./.github/actions/upload-to-server
        with:
          pattern: src-tauri/target/release/bundle/appimage/*.AppImage

  build-tauri-linux-arm64:
    needs: filter
    if: needs.filter.outputs.proceed == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .deb & .AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Setup SSH agent for server upload
        if: env.UPLOAD_SERVER_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UPLOAD_SERVER_SSH_KEY }}
      - name: Upload .deb to server
        if: env.UPLOAD_SERVER_HOST != ''
        uses: ./.github/actions/upload-to-server
        with:
          pattern: src-tauri/target/release/bundle/deb/*.deb
      - name: Upload .AppImage to server
        if: env.UPLOAD_SERVER_HOST != ''
        uses: ./.github/actions/upload-to-server
        with:
          pattern: src-tauri/target/release/bundle/appimage/*.AppImage

  build-tauri-windows:
    needs: filter
    if: needs.filter.outputs.proceed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .msi & .exe
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Setup SSH agent for server upload
        if: env.UPLOAD_SERVER_HOST != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UPLOAD_SERVER_SSH_KEY }}
      - name: Upload .msi to server
        if: env.UPLOAD_SERVER_HOST != ''
        uses: ./.github/actions/upload-to-server
        with:
          pattern: src-tauri/target/release/bundle/msi/*.msi
      - name: Upload .exe to server
        if: env.UPLOAD_SERVER_HOST != ''
        uses: ./.github/actions/upload-to-server
        with:
          pattern: src-tauri/target/release/bundle/nsis/*.exe
