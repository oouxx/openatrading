name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      linux:
        description: 'Build Linux'
        type: boolean
        default: true
      windows:
        description: 'Build Windows'
        type: boolean
        default: false

permissions:
  contents: write

env:

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

  # macOS DMG 不在此构建：由 release-brew.yml 统一产出（含 ad-hoc 签名校验），
  # 并推送到 Homebrew Tap。此处再建一次会重复构建同一产物。
  # 注意：job 级 if 条件读不到 secrets，若将来要在此构建 macOS，
  # 必须在仓库 Variables（而非 Secrets）中配置开关。

  build-tauri-linux-amd64:
    needs: create-release
    if: (vars.LINUX_BUILD != 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.linux == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .deb & .AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true

  build-tauri-linux-arm64:
    needs: create-release
    if: (vars.LINUX_BUILD != 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.linux == 'true'))
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .deb & .AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true

  build-tauri-windows:
    needs: create-release
    if: (vars.WINDOWS_BUILD == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.windows == 'true'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build frontend
        run: cd src && bun install && bun run build:tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Tauri app (bundle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build
      - name: Upload .msi & .exe
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
