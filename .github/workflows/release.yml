name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── CLI Binary — Linux x86_64 ────────────────────────
  build-cli-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: cargo build --release -p trending-agent-cli --target x86_64-unknown-linux-gnu
      - name: Rename binary
        run: cp target/x86_64-unknown-linux-gnu/release/openatrading openatrading-x86_64-unknown-linux-gnu
      - name: Upload CLI binary
        uses: softprops/action-gh-release@v2
        with:
          files: openatrading-x86_64-unknown-linux-gnu
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

  # ── CLI Binary — Linux aarch64 ───────────────────────
  build-cli-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release -p trending-agent-cli --target aarch64-unknown-linux-gnu
      - name: Rename binary
        run: cp target/aarch64-unknown-linux-gnu/release/openatrading openatrading-aarch64-unknown-linux-gnu
      - name: Upload CLI binary
        uses: softprops/action-gh-release@v2
        with:
          files: openatrading-aarch64-unknown-linux-gnu
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

  # ── Docker Image ─────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_VERSION=${{ github.ref_name }}

  # ── macOS Tauri (x64 + arm64) ────────────────────────
  build-tauri-macos:
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: rustup target add ${{ matrix.target }}
      - run: cd src && bun install
      - name: Set Tauri version
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          echo "Tauri version: $V"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseDraft: false

  # ── Linux Tauri (x64) ───────────────────────────────
  build-tauri-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: cd src && bun install
      - name: Set Tauri version
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          echo "Tauri version: $V"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-unknown-linux-gnu
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseDraft: false

  # ── Linux Tauri (arm64) ─────────────────────────────
  build-tauri-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: cd src && bun install
      - name: Set Tauri version
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          echo "Tauri version: $V"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-unknown-linux-gnu
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseDraft: false

  # ── Windows Tauri (x64) ─────────────────────────────
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: cd src && bun install
      - name: Set Tauri version
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          echo "Tauri version: $V"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseDraft: false
