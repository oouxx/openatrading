name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build-cli-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: cargo build --release -p openatrading-cli --target x86_64-unknown-linux-gnu
        env:
          GIT_VERSION: ${{ github.ref_name }}
      - name: Rename binary
        run: cp target/x86_64-unknown-linux-gnu/release/openatrading openatrading-x86_64-unknown-linux-gnu
      - name: Upload CLI binary
        uses: softprops/action-gh-release@v2
        with:
          files: openatrading-x86_64-unknown-linux-gnu
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

  build-cli-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release -p openatrading-cli --target aarch64-unknown-linux-gnu
        env:
          GIT_VERSION: ${{ github.ref_name }}
      - name: Rename binary
        run: cp target/aarch64-unknown-linux-gnu/release/openatrading openatrading-aarch64-unknown-linux-gnu
      - name: Upload CLI binary
        uses: softprops/action-gh-release@v2
        with:
          files: openatrading-aarch64-unknown-linux-gnu
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_VERSION=${{ github.ref_name }}

  build-docker-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-tauri-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          cache-on-failure: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            src/node_modules
          key: ${{ matrix.runner }}-bun-${{ hashFiles('src/bun.lock') }}

      - name: Install frontend deps
        working-directory: src
        run: bun install --frozen-lockfile

      - name: Set app version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            --target ${{ matrix.target }}
            --config '{"version":"${{ env.APP_VERSION }}"}'
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseDraft: false

  build-tauri-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          cache-on-failure: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            src/node_modules
          key: ubuntu-bun-${{ hashFiles('src/bun.lock') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend deps
        working-directory: src
        run: bun install --frozen-lockfile

      - name: Set app version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-unknown-linux-gnu --config '{"version":"${{ env.APP_VERSION }}"}'
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseDraft: false

  build-tauri-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          cache-on-failure: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            src/node_modules
          key: ubuntu-arm64-bun-${{ hashFiles('src/bun.lock') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend deps
        working-directory: src
        run: bun install --frozen-lockfile

      - name: Set app version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            --target aarch64-unknown-linux-gnu
            --config '{"version":"${{ env.APP_VERSION }}"}'
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseDraft: false

  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          cache-on-failure: true

      - uses: actions/cache@v4
        with:
          path: |
            ~\.bun\install\cache
            src\node_modules
          key: windows-bun-${{ hashFiles('src/bun.lock') }}

      - name: Install frontend deps
        working-directory: src
        run: bun install --frozen-lockfile

      - name: Set app version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            --target x86_64-pc-windows-msvc
            --config '{"version":"${{ env.APP_VERSION }}"}'
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseDraft: false