name: Deploy

# 等价于本地 ./deploy.sh [gateway|web|all]，但跑在服务器上的 self-hosted runner 里。
#
# 与 deploy.sh 的差异（不是偷工减料，是 runner 就在目标机上的必然结果）：
#   1. 不再 ssh/scp —— 代码由 actions/checkout 直接拉到 runner 工作区
#   2. .env 由服务器上的固定路径提供（它已 gitignore），不从仓库上传
#   3. ~/.atrading 与 ./downloads 这两个"仓库外的东西"用绝对路径钉死，
#      否则 compose 会把 ~ 展开成 runner 用户的 HOME、把 ./ 展开成 runner 工作区
#   4. .atrading/agent 配置不从仓库同步（同样已 gitignore），靠服务器上的常驻副本

on:
  workflow_dispatch:
    inputs:
      service:
        description: 要部署的服务
        type: choice
        options: ["all", "gateway", "web"]
        default: all
      ref:
        description: 分支 / tag / SHA（留空 = 触发时所在分支）
        type: string
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"

# 部署不能并发：两个 compose 同时 up 会互相打架。也不取消进行中的，避免半完成状态。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 固定项目名，保证与旧 deploy.sh（在 /root/openatrading 下执行）创建的容器是同一套。
  # 否则会新建一份 openatrading-xxx-1，旧容器继续占着 80/443/8080。
  COMPOSE_PROJECT_NAME: openatrading
  COMPOSE_BASE: docker-compose.yaml
  COMPOSE_CI: docker-compose.ci.yaml

jobs:
  deploy:
    name: deploy / ${{ inputs.service || 'all' }}
    # 要求 runner 上装了 docker + compose 插件，且该用户能访问 docker daemon
    runs-on: [self-hosted, linux]
    timeout-minutes: 45

    steps:
      - name: 预检（fail fast）
        shell: bash
        env:
          ENV_FILE_VAR: ${{ vars.ATRADING_ENV_FILE }}
          ATRADING_HOME_VAR: ${{ vars.ATRADING_HOST_HOME }}
          DOWNLOADS_VAR: ${{ vars.ATRADING_DOWNLOADS_DIR }}
        run: |
          set -euo pipefail
          echo "host=$(hostname) user=$(id -un) uid=$(id -u)"
          echo "workdir=$PWD"

          command -v docker >/dev/null || { echo "::error::runner 上没有 docker"; exit 1; }
          docker compose version >/dev/null 2>&1 || {
            echo "::error::缺少 docker compose 插件（docker-compose-plugin）"; exit 1; }
          docker info >/dev/null 2>&1 || {
            echo "::error::当前用户无法访问 docker daemon —— 把 runner 用户加入 docker 组，或用 root 跑 runner"
            exit 1; }

          # ── .env ────────────────────────────────────────────────
          ENV_FILE="${ENV_FILE_VAR:-/etc/openatrading/.env}"
          if [ ! -f "$ENV_FILE" ] && [ -f /root/openatrading/.env ]; then
            ENV_FILE=/root/openatrading/.env
            echo "::warning::仍在用旧 deploy.sh 留在 /root/openatrading/.env 的副本，建议迁到 /etc/openatrading/.env（chmod 600）"
          fi
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::找不到 .env（已查找 ${ENV_FILE_VAR:-/etc/openatrading/.env}）"
            echo "  修法：mkdir -p /etc/openatrading && install -m 600 <你的.env> /etc/openatrading/.env"
            echo "  或设置仓库变量 ATRADING_ENV_FILE 指向真实路径"
            exit 1
          fi
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          # 绝不打印内容，只报变量个数
          echo "  .env: $ENV_FILE（$(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' "$ENV_FILE" || true) 个变量）"

          # ── agent home（compose 里写的是 ~/.atrading）────────────────
          HOST_HOME="${ATRADING_HOME_VAR:-}"
          if [ -z "$HOST_HOME" ]; then
            if [ "$(id -u)" = "0" ]; then
              HOST_HOME=/root/.atrading
            elif [ -d /root/.atrading ]; then
              HOST_HOME=/root/.atrading
              echo "::warning::runner 是非 root 用户：~/.atrading 会展开成 $HOME/.atrading，已改用 /root/.atrading（见 override）"
            else
              HOST_HOME="$HOME/.atrading"
            fi
          fi
          mkdir -p "$HOST_HOME/agent"
          echo "ATRADING_HOST_HOME=$HOST_HOME" >> "$GITHUB_ENV"
          echo "  agent home: $HOST_HOME"
          [ -f "$HOST_HOME/agent/AGENTS.md" ] || \
            echo "::warning::$HOST_HOME/agent/AGENTS.md 不存在，agent 会缺指令（deploy.sh 的 sync_agent_config 需要人工跑一次）"

          # ── 下载目录（compose 里写的是 ./downloads，相对 compose 文件所在目录）──
          DL_DIR="${DOWNLOADS_VAR:-}"
          if [ -z "$DL_DIR" ]; then
            if [ -d /root/openatrading/downloads ]; then DL_DIR=/root/openatrading/downloads
            else DL_DIR="$PWD/downloads"; mkdir -p "$DL_DIR"
              echo "::warning::没有找到旧的下载目录，使用了 $DL_DIR（install.sh 的 /downloads 会是空的）"
            fi
          fi
          mkdir -p "$DL_DIR"
          echo "ATRADING_DOWNLOADS_DIR=$DL_DIR" >> "$GITHUB_ENV"
          echo "  downloads: $DL_DIR（$(find "$DL_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ') 个文件）"

          df -h "$PWD" | tail -1 | awk '{print "  磁盘可用: "$4}'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          clean: true

      - name: 准备 .env 与 compose override（并断言路径解析正确）
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -m 600 "$ENV_FILE" .env

          # 只覆盖"会被 runner 身份/工作区位置影响"的部分，其余沿用 docker-compose.yaml
          cat > "$COMPOSE_CI" <<EOF
          # 由 .github/workflows/deploy.yml 生成，不要提交
          services:
            gateway:
              build:
                labels:
                  org.opencontainers.image.revision: "${{ github.sha }}"
                  org.opencontainers.image.source: "${{ github.server_url }}/${{ github.repository }}"
              volumes:
                - ${ATRADING_HOST_HOME}:/root/.atrading
            frontend:
              volumes:
                - ${ATRADING_DOWNLOADS_DIR}:/app/downloads
          EOF

          args=(-f "$COMPOSE_BASE" -f "$COMPOSE_CI")
          docker compose "${args[@]}" config --quiet
          rendered=$(docker compose "${args[@]}" config)

          # 断言而不是假设：compose 的 volumes 按 target 合并，若行为不符就会变成两个
          # 同名挂载点（容器直接起不来）。这里提前炸掉，给出可读的原因。
          assert_one() {
            local target="$1" source="$2"
            local n
            n=$(printf '%s\n' "$rendered" | grep -c "^ *target: $target\$" || true)
            if [ "$n" != "1" ]; then
              echo "::error::挂载点 $target 期望 1 个，实际 $n 个 —— compose 合并行为不符合预期"
              printf '%s\n' "$rendered" | grep -n -A2 "target: $target" || true
              exit 1
            fi
            printf '%s\n' "$rendered" | grep -q "^ *source: $source\$" || {
              echo "::error::$target 的宿主路径不是 $source"; exit 1; }
            echo "  ✅ $source -> $target"
          }
          assert_one /root/.atrading "$ATRADING_HOST_HOME"
          assert_one /app/downloads "$ATRADING_DOWNLOADS_DIR"

      - name: 构建
        shell: bash
        env:
          SERVICE: ${{ inputs.service || 'all' }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            gateway) target=gateway ;;
            web)     target=frontend ;;
            all)     target= ;;
          esac
          echo "构建 $SERVICE ..."
          # shellcheck disable=SC2086
          docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_CI" build $target

      - name: 启动
        shell: bash
        env:
          SERVICE: ${{ inputs.service || 'all' }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            gateway) target=gateway ;;
            web)     target=frontend ;;
            all)     target= ;;
          esac
          # shellcheck disable=SC2086
          docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_CI" up -d --remove-orphans $target
          docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_CI" ps

      - name: 健康检查
        shell: bash
        run: |
          set -euo pipefail
          # 直连 gateway 的 8080，绕开 nginx/证书/域名，避免误判
          ok=0
          for i in $(seq 1 30); do
            if body=$(curl -fsS --max-time 3 http://127.0.0.1:8080/api/about 2>/dev/null); then
              echo "第 ${i} 次探测成功: $body"
              ok=1; break
            fi
            sleep 2
          done
          [ "$ok" = "1" ] || { echo "::error::gateway 60s 内未就绪（http://127.0.0.1:8080/api/about）"; exit 1; }

          # 前端：200 正常，301/302 是配了证书跳 https
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/ || true)
          case "$code" in
            200|301|302) echo "前端 :80 -> $code ✅" ;;
            *) echo "::warning::前端 :80 -> $code，检查 frontend 容器日志" ;;
          esac

      - name: 清理悬空镜像
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          docker image prune -f | tail -1
          df -h / | tail -1 | awk '{print "根分区可用: "$4}'

      - name: 失败诊断
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "=== compose ps ==="
          docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_CI" ps || true
          echo
          echo "=== 最近日志（每服务 80 行）==="
          docker compose -f "$COMPOSE_BASE" -f "$COMPOSE_CI" logs --tail=80 --no-color || true
          echo
          echo "=== 磁盘 ==="
          df -h / | tail -1 || true

      - name: 汇总
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy ${{ job.status }}"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 服务 | \`${{ inputs.service || 'all' }}\` |"
            echo "| 提交 | [\`${GITHUB_SHA:0:8}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| 分支/tag | \`${{ inputs.ref || github.ref_name }}\` |"
            echo "| 主机 | \`$(hostname)\` |"
            echo "| agent home | \`${ATRADING_HOST_HOME}\` |"
            echo "| downloads | \`${ATRADING_DOWNLOADS_DIR}\` |"
            echo "| 触发 | ${{ github.event_name }} by ${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
