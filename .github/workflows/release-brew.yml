name: Release Brew Cask

# 将桌面端 DMG 发布到 Homebrew Tap 仓库（跨仓库），并更新 cask。
# Tap 位于独立仓库 oouxx/homebrew-openatrading，默认 GITHUB_TOKEN 无权访问，
# 必须配置 secrets.TAP_GITHUB_TOKEN：一个对 tap 仓库有 Contents: Read/write 的
# fine-grained PAT（或 classic PAT，scope=repo）。
#
# 版本号以仓库根 Cargo.toml 的 workspace.version 为准（与本地 release-brew.sh 一致），
# 不再依赖 git tag，避免 workflow_dispatch 时误用分支名当 tag。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # publish-cask 要把 DMG 上传到本仓库的 release，因此需要 write
  contents: write

concurrency:
  group: release-brew
  cancel-in-progress: false

env:
  TAP_REPO: oouxx/homebrew-openatrading

jobs:
  build-macos:
    runs-on: macos-14 # arm64；x64 通过交叉编译产出
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          V=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          [ -n "$V" ] || { echo "❌ 无法从 Cargo.toml 解析版本号"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            src/node_modules
            ~/.bun/install/cache
          key: bun-${{ hashFiles('src/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Rust x64 target
        run: rustup target add x86_64-apple-darwin

      - name: Build frontend
        run: cd src && bun install && bun run build:tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app (aarch64, native)
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build

      - name: Verify aarch64 signature
        run: bash scripts/verify-macos-signature.sh target/release/bundle/macos/openatrading.app

      - name: Build Tauri app (x64, cross)
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo tauri build --target x86_64-apple-darwin

      - name: Verify x64 signature
        run: bash scripts/verify-macos-signature.sh target/x86_64-apple-darwin/release/bundle/macos/openatrading.app

      - name: Collect DMGs
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          find target -type f -name "openatrading_${V}_*.dmg" ! -name 'rw.*' -exec cp {} dist/ \;
          ls -l dist
          for a in x64 aarch64; do
            [ -f "dist/openatrading_${V}_${a}.dmg" ] || { echo "❌ 缺少 ${a} DMG"; exit 1; }
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish-cask:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Compute checksums
        id: sha
        run: |
          set -euo pipefail
          V="${{ needs.build-macos.outputs.version }}"
          x64=$(sha256sum "dist/openatrading_${V}_x64.dmg" | awk '{print $1}')
          arm=$(sha256sum "dist/openatrading_${V}_aarch64.dmg" | awk '{print $1}')
          echo "x64=$x64" >> "$GITHUB_OUTPUT"
          echo "aarch64=$arm" >> "$GITHUB_OUTPUT"

      # 跨仓库 checkout：使用专用于 tap 的 token，push 时复用其持久化凭据
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Create/reuse tap release & upload DMGs
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release create "$TAG" --repo "$TAP_REPO" \
            --title "$TAG" --notes "OpenATrading $VERSION" \
            2>/dev/null || echo "ℹ Release $TAG 已存在，复用"
          gh release upload "$TAG" dist/*.dmg --repo "$TAP_REPO" --clobber
          echo "✅ 已上传 DMG → $TAP_REPO $TAG"

      # 同一批 DMG 也挂到本仓库的 release：landing page 与 README 的桌面端下载
      # 都指向这里，只放 tap 仓库的话主仓库 release 里根本没有 .dmg。
      - name: 同步 DMG 到本仓库 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          # 正常情况下 release 已由 release-cli / release-tauri 的 create-release 建好；
          # 单独 dispatch 本 workflow 时可能还没有，补建一个避免 upload 失败。
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" \
                 --title "$TAG" --notes "OpenATrading $VERSION"
          gh release upload "$TAG" dist/*.dmg --repo "$REPO" --clobber
          echo "✅ 已上传 DMG → $REPO $TAG"
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | select(.name | endswith(".dmg")) | "   \(.name)  \(.size/1024/1024|floor)MB"'

      - name: Update cask
        env:
          BREW_CASK: tap/Casks/openatrading.rb
          BREW_VERSION: ${{ needs.build-macos.outputs.version }}
          BREW_SHA_X64: ${{ steps.sha.outputs.x64 }}
          BREW_SHA_AARCH64: ${{ steps.sha.outputs.aarch64 }}
        run: ruby scripts/update-cask.rb

      - name: Commit & push tap
        working-directory: tap
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/openatrading.rb; then
            echo "ℹ Cask 无变化（已是 $VERSION）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/openatrading.rb
          git commit -m "openatrading $VERSION"
          git push
          echo "✅ 已推送 cask $VERSION → $TAP_REPO"
