name: Upload to Server
description: Upload build artifacts to self-hosted server via SCP
inputs:
  pattern:
    description: Glob pattern of files to upload
    required: true
runs:
  using: composite
  steps:
    - name: SCP upload
      shell: bash
      run: |
        set -euo pipefail
        server="${UPLOAD_SERVER_USER}@${UPLOAD_SERVER_HOST}"
        remote_dir="${UPLOAD_SERVER_PATH}"
        ssh -o StrictHostKeyChecking=no "$server" "mkdir -p '${remote_dir}'"
        for f in ${{ inputs.pattern }}; do
          [ -f "$f" ] || continue
          echo "Uploading: $f"
          scp -o StrictHostKeyChecking=no "$f" "${server}:'${remote_dir}/'"
        done
